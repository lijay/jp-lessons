
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>阜杭豆漿紹介</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#111;color:#fff}
.slide{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;box-sizing:border-box}
.slide img{max-width:90%;max-height:65vh;object-fit:contain;border-radius:12px}
h1,h2{text-align:center}
p{max-width:900px;font-size:1.3rem;line-height:1.8}
</style>
</head>
<body>
<div class="slide">
<h1>台湾で人気の朝食店<br>阜杭豆漿（フーハンドウジャン）</h1>
<img src="燒餅、豆漿、鹹豆漿、厚燒餅全餐.png">
<p>1958年創業。ミシュラン・ビブグルマンにも選ばれた台湾の有名朝食店です。</p>
</div>

<div class="slide">
<h2>毎日大行列</h2>
<img src="排隊照片1.jpeg">
<p>平日でも休日でも多くの人が並びます。日本人観光客にも人気があります。</p>
</div>

<div class="slide">
<h2>店内の様子</h2>
<img src="用餐區很多人同時有拍到豆漿店.jpeg">
<p>華山市場の2階にあり、いつも賑わっています。</p>
</div>

<div class="slide">
<h2>私の一番おすすめ</h2>
<img src="厚燒餅.jpeg">
<p>厚餅夾蛋と厚餅夾油条が大好きです。外はサクサク、中はもちもちです。</p>
</div>

<div class="slide">
<h2>鹹豆漿（シェンドウジャン）</h2>
<img src="鹹豆漿.png">
<p>子どもの頃は見た目が少し苦手でしたが、今では大好きです。</p>
</div>

<div class="slide">
<h2>あみ先生は食べてみたいですか？</h2>
<img src="出餐品餐盤上的豆漿.jpeg">
<p>台湾に来る機会があれば、ぜひおすすめしたい朝食です。</p>
</div>
</body>
</html>
